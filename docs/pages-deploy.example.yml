# INACTIVE EXAMPLE. After explicit GitHub Pages approval/configuration,
# copy this to .github/workflows/deploy-pages.yml and inspect branch protections.
name: Deploy approved travel static Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build static URL pages
        env:
          SITE_URL: ${{ vars.TRAVEL_SITE_URL }}
        run: node scripts/build-site.mjs
      - name: Test direct URLs and canonical
        run: node --test tests/*.test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
