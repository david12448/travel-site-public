name: Validate travel public site
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check app.js
      - run: node --test tests/*.test.mjs
