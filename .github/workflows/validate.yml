name: Validate travel public site
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python3 scripts/build_static_routes.py
      - run: node --check app.js
      - run: node --test tests/*.test.mjs
      - name: HTTP deep-link smoke test (direct navigation and refresh target)
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/travel-pretty-pages.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1
          curl -fsS http://127.0.0.1:8765/places/kr/jeju/saryeoni-forest/ | grep -q '<h1>사려니숲길</h1>'
          curl -fsS http://127.0.0.1:8765/places/kr/busan/gamcheon-culture-village/ | grep -q '<h1>감천문화마을</h1>'
          curl -fsS http://127.0.0.1:8765/places/jp/kyoto/arashiyama/ | grep -q '<h1>교토 아라시야마</h1>'
          curl -fsS http://127.0.0.1:8765/styles.css >/dev/null
          curl -fsS 'http://127.0.0.1:8765/?place=kr-jeju-saryeoni-forest' >/dev/null
